name: Pruebas carrito multiproducto

on:
  push:
    branches:
      - feature/carrito-multiproducto
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-carrito:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar sintaxis
        run: python -m compileall -q app.py carrito_cotizacion.py carrito_flujo.py
      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v
